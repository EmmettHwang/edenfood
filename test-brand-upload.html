<!DOCTYPE html>
<html>
<head>
    <title>브랜드 업로드 테스트</title>
</head>
<body>
    <h2>브랜드 이미지 업로드 테스트</h2>
    <form id="uploadForm">
        <input type="file" id="fileInput" accept="image/*">
        <button type="submit">업로드</button>
    </form>
    <div id="result"></div>

    <script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];
        
        if (!file) {
            alert('파일을 선택하세요');
            return;
        }
        
        const formData = new FormData();
        formData.append('image', file);
        formData.append('type', 'brand');
        
        const token = localStorage.getItem('eden_token');
        
        try {
            const response = await fetch('/api/brands/upload', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token
                },
                body: formData
            });
            
            const data = await response.json();
            console.log('Response:', data);
            document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            
            if (data.ok || data.success) {
                alert('업로드 성공: ' + (data.imageUrl || data.url));
            } else {
                alert('업로드 실패: ' + (data.error || data.message || '알 수 없는 오류'));
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('result').innerHTML = '<pre>Error: ' + error + '</pre>';
        }
    });
    </script>
</body>
</html>
