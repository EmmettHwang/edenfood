<script>
// 대시보드 데이터 로드
async function loadDashboardStats() {
  try {
    const token = localStorage.getItem('eden_token');
    const response = await fetch('/api/dashboard-stats', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    
    if (response.ok) {
      const data = await response.json();
      if (data.ok) {
        // 실제 데이터로 업데이트
        document.getElementById('todayVisitors').textContent = data.stats.todayVisitors || '0';
        document.getElementById('weekVisitors').textContent = data.stats.weekVisitors || '0';
        document.getElementById('totalVisitors').textContent = data.stats.totalVisitors || '0';
        document.getElementById('activeUsers').textContent = data.stats.activeUsers || '0';
        document.getElementById('totalPosts').textContent = data.stats.totalPosts || '0';
        document.getElementById('newContacts').textContent = data.stats.newContacts || '0';
      }
    } else {
      // API 오류 시 예시 데이터 표시
      console.log('대시보드 통계 API가 아직 구현되지 않았습니다. 예시 데이터를 표시합니다.');
      document.getElementById('todayVisitors').textContent = '234';
      document.getElementById('weekVisitors').textContent = '1,567';
      document.getElementById('totalVisitors').textContent = '12,345';
      document.getElementById('activeUsers').textContent = '5';
      document.getElementById('totalPosts').textContent = '156';
      document.getElementById('newContacts').textContent = '23';
    }
  } catch (error) {
    console.error('대시보드 데이터 로드 실패:', error);
    // 오류 시 예시 데이터 표시
    document.getElementById('todayVisitors').textContent = '234';
    document.getElementById('weekVisitors').textContent = '1,567';
    document.getElementById('totalVisitors').textContent = '12,345';
    document.getElementById('activeUsers').textContent = '5';
    document.getElementById('totalPosts').textContent = '156';
    document.getElementById('newContacts').textContent = '23';
  }
}

// 시스템 모니터링 데이터 로드
async function loadSystemMonitoring() {
  try {
    const token = localStorage.getItem('eden_token');
    const response = await fetch('/api/system-info', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    
    console.log('System info response status:', response.status);
    
    if (response.ok) {
      const data = await response.json();
      console.log('System info data:', data);
      
      // data.data 구조 확인
      const systemInfo = data.data || data;
      console.log('System info:', systemInfo);
      
      // CPU 사용률
      if (systemInfo.cpu) {
        const cpuUsage = systemInfo.cpu.usage || 0;
        document.getElementById('cpu-value').textContent = cpuUsage + '%';
        document.getElementById('cpu-chart').style.height = cpuUsage + '%';
        document.getElementById('cpu-detail').textContent = `${systemInfo.cpu.cores || 0}코어`;
        updateStatus('cpu-status', cpuUsage, 70, 90);
      }
      
      // 메모리 사용률
      if (systemInfo.memory) {
        const memUsage = systemInfo.memory.usage || 0;
        const memUsed = systemInfo.memory.used || 0;
        const memTotal = systemInfo.memory.total || 0;
        document.getElementById('memory-value').textContent = memUsage + '%';
        document.getElementById('memory-chart').style.height = memUsage + '%';
        document.getElementById('memory-detail').textContent = `${memUsed.toFixed(1)}GB / ${memTotal.toFixed(1)}GB`;
        updateStatus('memory-status', memUsage, 80, 95);
      }
      
      // 디스크 사용률
      if (systemInfo.disk) {
        const diskUsage = systemInfo.disk.usage || 0;
        const diskUsed = systemInfo.disk.used || 0;
        const diskTotal = systemInfo.disk.total || 0;
        document.getElementById('disk-value').textContent = diskUsage + '%';
        document.getElementById('disk-chart').style.height = diskUsage + '%';
        document.getElementById('disk-detail').textContent = `${diskUsed.toFixed(1)}GB / ${diskTotal.toFixed(1)}GB`;
        updateStatus('disk-status', diskUsage, 85, 95);
      }
      
      // 추가 정보를 툴팁으로 표시
      if (systemInfo.cpu) {
        const cpuCard = document.querySelector('.monitor-cpu');
        if (cpuCard) {
          cpuCard.title = `CPU: ${systemInfo.cpu.model || 'Unknown'}\n코어: ${systemInfo.cpu.cores || 0}개\nLoad Average: ${systemInfo.loadavg ? systemInfo.loadavg[0].toFixed(2) : 'N/A'}`;
        }
      }
      
      if (systemInfo.memory) {
        const memoryCard = document.querySelector('.monitor-memory');
        if (memoryCard) {
          memoryCard.title = `전체: ${(systemInfo.memory.total || 0).toFixed(1)}GB\n사용: ${(systemInfo.memory.used || 0).toFixed(1)}GB\n여유: ${(systemInfo.memory.free || 0).toFixed(1)}GB`;
        }
      }
      
      if (systemInfo.disk) {
        const diskCard = document.querySelector('.monitor-disk');
        if (diskCard) {
          diskCard.title = `전체: ${(systemInfo.disk.total || 0).toFixed(1)}GB\n사용: ${(systemInfo.disk.used || 0).toFixed(1)}GB\n여유: ${(systemInfo.disk.free || 0).toFixed(1)}GB`;
        }
      }
    } else {
      console.error('System info response not ok:', await response.text());
    }
  } catch (error) {
    console.error('시스템 모니터링 데이터 로드 실패:', error);
  }
}

// 상태 표시 업데이트
function updateStatus(elementId, value, warningThreshold, dangerThreshold) {
  const element = document.getElementById(elementId);
  if (element) {
    element.classList.remove('warning', 'danger');
    
    if (value >= dangerThreshold) {
      element.classList.add('danger');
    } else if (value >= warningThreshold) {
      element.classList.add('warning');
    }
  }
}

// 시스템 모니터링 시작
let monitoringInterval = null;

window.startSystemMonitoring = function() {
  // 기존 인터벌 클리어
  if (monitoringInterval) {
    clearInterval(monitoringInterval);
  }
  
  // 즉시 로드
  loadSystemMonitoring();
  
  // 5초마다 업데이트
  monitoringInterval = setInterval(loadSystemMonitoring, 5000);
};

// 페이지 로드 시 데이터 로드
if (typeof window !== 'undefined') {
  loadDashboardStats();
  // 30초마다 새로고침
  setInterval(loadDashboardStats, 30000);
  
  // 시스템 모니터링 시작
  window.startSystemMonitoring();
}
</script>
