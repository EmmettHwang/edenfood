<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>홈페이지유지관리비 · 이든푸드 관리자</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://pay.nicepay.co.kr/v1/js/"></script>
<style>
  :root{--g:#16a34a;--line:#e6e9ec;--dim:#6b7280}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;background:#f6f7f9;color:#222}
  .wrap{max-width:880px;margin:0 auto;padding:24px 20px 60px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13.5px;margin-bottom:22px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
  .row{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
  .big{font-size:30px;font-weight:800;letter-spacing:-.5px}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px}
  .ok{background:#e7f6ec;color:#137333}.warn{background:#fdecea;color:#c5221f}.soon{background:#fff4e5;color:#a15c00}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
  th{background:#fafbfc;color:#555;font-weight:600;font-size:13px}
  td.num,th.num{text-align:right}
  .btn{border:0;border-radius:8px;padding:12px 18px;font-size:14.5px;font-weight:700;cursor:pointer}
  .btn-pay{background:var(--g);color:#fff}
  .btn-ghost{background:#fff;border:1px solid #cfd4da;color:#333}
  .plan{border:2px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;flex:1;min-width:240px}
  .plan.on{border-color:var(--g);background:#f2fbf5}
  .plan .t{font-weight:700;margin-bottom:4px}
  .plan .p{font-size:20px;font-weight:800}
  .plan .s{font-size:12.5px;color:var(--dim);margin-top:4px}
  .muted{color:var(--dim);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>💳 홈페이지유지관리비</h1>
  <div class="sub">이 사이트를 운영·관리하는 데 드는 홈페이지 유지관리비입니다. 기한이 지나면 서비스가 중지될 수 있습니다.</div>

  <div class="card" id="summary">불러오는 중…</div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:12px">결제하기</div>
    <div class="row" style="margin-bottom:14px">
      <div class="plan on" id="plan-month" onclick="pickPlan('month')">
        <div class="t">월 결제</div>
        <div class="p" id="p-month">-</div>
        <div class="s">매달 청구</div>
      </div>
      <div class="plan" id="plan-annual" onclick="pickPlan('annual')">
        <div class="t">1년 선결제 <span class="tag ok" id="dc-tag">할인</span></div>
        <div class="p" id="p-annual">-</div>
        <div class="s" id="s-annual">-</div>
      </div>
    </div>
    <div class="row">
      <button class="btn btn-pay" onclick="pay('card')">카드로 결제</button>
      <!-- 가상계좌는 2026-09-14 에 감췄다.
           ⚠️ 이 상점은 가상계좌가 열려 있지 않아 누르면 나이스페이가
              «[W004] 결제수단이 유효하지 않습니다» 로 막는다. 눌러 봐야 혼란만 준다.
              나중에 가상계좌를 신청해 열리면 이 줄만 되살리면 된다(코드는 그대로 있다).
        <button class="btn btn-ghost" onclick="pay('vbank')">가상계좌 받기</button>
      -->
      <span class="muted" style="flex:1">결제하시면 카드 매출전표(영수증)가 바로 발행됩니다.</span>
    </div>
    <div id="msg" style="margin-top:12px"></div>
  </div>

  <div id="compare"></div>

  <!-- 안내 문자 — 기한이 다가오면 이 번호로 보낸다 (2026-09-15) -->
  <div class="card">
    <div style="font-weight:700;margin-bottom:6px">안내 문자 받을 번호</div>
    <div class="muted" style="margin-bottom:12px">
      납부 기한 <b>7일 · 3일 · 1일 전과 당일</b>에 한 번씩 문자로 알려 드립니다.
    </div>
    <div class="row" style="align-items:center">
      <input type="tel" id="alert-phone" placeholder="010-0000-0000" maxlength="13"
             style="width:170px;padding:10px 12px;border:1px solid #cfd4da;border-radius:8px;font-size:15px">
      <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer">
        <input type="checkbox" id="alert-on"> 문자 받기
      </label>
      <button class="btn btn-ghost" onclick="saveAlert()">저장</button>
      <span id="alert-msg" class="muted" style="flex:1"></span>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:10px">납부 내역</div>
    <div id="pays">불러오는 중…</div>
  </div>

  <p class="muted">문의는 서비스 제공자에게 연락해 주세요.</p>
</div>

<script>
const SITE = 'edenfood';
let B = null, PLAN = 'month';
const won = n => (n || 0).toLocaleString('ko-KR') + '원';

async function load() {
  try {
    const r = await fetch('/api/server-billing');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    B = await r.json();
  } catch (e) {
    document.getElementById('summary').innerHTML =
      '<span style="color:#c5221f">요금 정보를 불러오지 못했습니다: ' + (e.message || e) + '</span>';
    return;
  }
  const overdue = B.overdue === true;
  const soon = !overdue && B.days_left !== null && B.days_left <= 7;
  document.getElementById('summary').innerHTML =
      '<div class="row">'
    +   '<div><div class="muted">월 이용료</div><div class="big">' + won(B.monthly_fee) + '</div></div>'
    +   '<div style="flex:1"></div>'
    +   '<div style="text-align:right">'
    +     '<div class="muted">납부 기한</div>'
    +     '<div style="font-size:18px;font-weight:700">' + (B.paid_until || '미정') + '</div>'
    +     (B.days_left === null ? ''
        : overdue ? '<span class="tag warn">기한이 지났습니다</span>'
        : soon ? '<span class="tag soon">' + B.days_left + '일 남음</span>'
               : '<span class="tag ok">' + B.days_left + '일 남음</span>')
    +   '</div>'
    + '</div>'
    + (B.note ? '<div class="muted" style="margin-top:10px">' + B.note + '</div>' : '');

  document.getElementById('p-month').textContent = won(B.monthly_fee);
  document.getElementById('p-annual').textContent = won(B.annual_fee);
  document.getElementById('dc-tag').textContent = (B.annual_dc_pct || 0) + '% 할인';
  document.getElementById('s-annual').textContent =
      won(B.monthly_fee * 12) + ' → ' + won(B.annual_fee) + ' (' + won(B.annual_save) + ' 절약)';

  const ps = B.payments || [];
  const 구분 = p => p.plan === 'annual' ? '1년' : p.plan ? '월' : (p.memo || '');
  const 상태 = p => p.status === 'paid' ? '완료'
                  : p.status === 'vbankReady' ? '입금 대기' : (p.status || '완료');
  const 날짜 = p => p.at || ((p.year || '') + '년 ' + (p.month || '') + '월');
  document.getElementById('pays').innerHTML = ps.length
    ? '<table><tr><th>날짜</th><th>구분</th><th class="num">금액</th><th>상태</th><th>영수증</th></tr>'
      + ps.map(p => '<tr><td>' + 날짜(p) + '</td><td>' + 구분(p) + '</td>'
                  + '<td class="num">' + won(p.amount) + '</td>'
                  + '<td>' + 상태(p) + '</td><td>'
                  + (p.receipt
                      ? '<a href="#" onclick="openReceipt(\'' + (p.tid || '') + '\');return false;">보기</a>'
                      : '<span class="muted">-</span>')
                  + '</td></tr>').join('')
      + '</table>'
    : '<span class="muted">아직 납부 내역이 없습니다.</span>';

  document.getElementById('compare').innerHTML = compareBox(B);
  initAlert();
}

function pickPlan(p) {
  PLAN = p;
  document.getElementById('plan-month').classList.toggle('on', p === 'month');
  document.getElementById('plan-annual').classList.toggle('on', p === 'annual');
}


/* 로그인한 관리자 정보 — 영수증 조회용 구매자 정보로 쓴다.
   ⚠️ 이 화면은 iframe 안이라 부모 창의 localStorage 를 볼 수 있다(같은 출처). */

/* 영수증 모달 — 새 창 대신 이 자리에서 보여 준다 (2026-09-15).
   ⚠️ 인쇄할 때는 **영수증만** 나가야 한다. iframe 을 직접 인쇄해서
      바깥 화면(메뉴·목록)이 종이에 딸려 나가지 않게 한다. */
function openReceipt(tid) {
  if (!tid) return;
  var w = document.createElement('div');
  w.id = 'rc-overlay';
  w.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.55);'
                  + 'display:flex;align-items:center;justify-content:center;padding:18px';
  w.innerHTML =
    '<div style="background:#fff;border-radius:14px;width:100%;max-width:600px;'
  + 'max-height:92vh;display:flex;flex-direction:column;overflow:hidden;'
  + 'box-shadow:0 24px 64px rgba(0,0,0,.35)">'
  +   '<div style="display:flex;align-items:center;gap:8px;padding:12px 16px;'
  +     'border-bottom:1px solid #e6e9ec">'
  +     '<b style="flex:1;font-size:15.5px">영수증</b>'
  +     '<button id="rc-print" style="border:0;border-radius:8px;padding:8px 14px;'
  +       'background:#16a34a;color:#fff;font-weight:700;font-size:13.5px;cursor:pointer">인쇄</button>'
  +     '<button id="rc-close" style="border:1px solid #cfd4da;background:#fff;border-radius:8px;'
  +       'padding:8px 12px;font-size:13.5px;cursor:pointer">닫기</button>'
  +   '</div>'
  +   '<iframe id="rc-frame" src="/api/server-billing/receipt?tid=' + encodeURIComponent(tid) + '"'
  +     ' style="flex:1;width:100%;min-height:460px;border:0"></iframe>'
  + '</div>';
  document.body.appendChild(w);

  function close() { w.remove(); document.removeEventListener('keydown', esc); }
  function esc(e) { if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', esc);
  w.querySelector('#rc-close').onclick = close;
  // 바깥을 눌러 닫기 — 누른 자리와 뗀 자리가 **둘 다** 바깥일 때만(글자 끌기 방지)
  var down = false;
  w.addEventListener('mousedown', function (e) { down = (e.target === w); });
  w.addEventListener('mouseup', function (e) { if (down && e.target === w) close(); down = false; });
  w.querySelector('#rc-print').onclick = function () {
    var f = document.getElementById('rc-frame');
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch (e) { window.open(f.src, '_blank'); }
  };
}


/* 안내 문자 번호 — 치는 대로 `-` 가 들어가고, 저장은 관리자만 된다. */
function dashPhone(v) {
  var d = String(v || '').replace(/\D/g, '').slice(0, 11);
  if (!d) return '';
  if (d.startsWith('02')) {
    if (d.length < 3) return d;
    if (d.length < 6) return d.slice(0,2) + '-' + d.slice(2);
    if (d.length < 10) return d.slice(0,2) + '-' + d.slice(2,5) + '-' + d.slice(5);
    return d.slice(0,2) + '-' + d.slice(2,6) + '-' + d.slice(6,10);
  }
  if (d.length < 4) return d;
  if (d.length < 8) return d.slice(0,3) + '-' + d.slice(3);
  if (d.length < 11) return d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6);
  return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7);
}

function initAlert() {
  var el = document.getElementById('alert-phone');
  if (!el) return;
  el.value = dashPhone((B && B.alert_phone) || '');
  document.getElementById('alert-on').checked = !!(B && B.alert_on);
  el.oninput = function () { el.value = dashPhone(el.value); };
}

async function saveAlert() {
  var msg = document.getElementById('alert-msg');
  var phone = document.getElementById('alert-phone').value.trim();
  var on = document.getElementById('alert-on').checked;
  if (on && phone.replace(/\D/g, '').length < 10) {
    msg.innerHTML = '<span style="color:#c5221f">번호를 정확히 넣어 주세요.</span>';
    return;
  }
  msg.textContent = '저장하는 중…';
  try {
    // ⚠️ 관리자 토큰을 함께 보낸다. 서버가 관리자인지 확인한 뒤에만 저장한다.
    var tok = localStorage.getItem('eden_token')
           || (window.parent && window.parent.localStorage.getItem('eden_token'));
    var r = await fetch('/api/server-billing/alert', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (tok || '') },
      body: JSON.stringify({ phone: phone, alert_on: on })
    });
    var j = await r.json();
    if (!r.ok || j.ok === false) {
      msg.innerHTML = '<span style="color:#c5221f">' + (j.error || '저장하지 못했습니다.') + '</span>';
      return;
    }
    msg.innerHTML = '<span style="color:#137333">저장했습니다.</span>';
    setTimeout(function () { msg.textContent = ''; }, 2500);
  } catch (e) {
    msg.innerHTML = '<span style="color:#c5221f">저장하지 못했습니다.</span>';
  }
}

/* 「cafe24 대비 얼마나 저렴한가」 비교 (교수오빠, 2026-09-15)
   ⚠️ 기준은 캡처로 확인한 cafe24 호스팅 「자이언트플러스」다
      (월 55,000원 VAT 포함 · 설치비 22,000원 VAT 포함, 2026-09-15 조회).
   ⚠️ 숫자를 화면에 박지 않는다 — 요금이 바뀌면 여기 계산이 따라간다.
   ⚠️ 도메인 유지관리비(22,000원/년)는 **우리 요금에 들어 있다.** cafe24 는 별도다. */
function compareBox(B) {
  var CAFE_MONTH = 55000;     // cafe24 자이언트플러스 월 사용료 (VAT 포함)
  var CAFE_SETUP = 22000;     // 설치비 (VAT 포함, 처음 한 번)
  var DOMAIN_YEAR = 22000;    // 도메인 유지관리비 (1년)

  var won = function (n) { return (Number(n) || 0).toLocaleString('ko-KR') + '원'; };
  var ourMonthYear = (B.monthly_fee || 0) * 12;
  var ourAnnual = B.annual_fee || 0;
  var cafeFirst = CAFE_MONTH * 12 + CAFE_SETUP + DOMAIN_YEAR;
  var cafeNext = CAFE_MONTH * 12 + DOMAIN_YEAR;
  var saveAnnual = cafeFirst - ourAnnual;      // 1년 선결제로 처음 1년

  var row = function (label, v, strong) {
    return '<tr><td style="padding:7px 0;color:#6b7280">' + label + '</td>'
         + '<td style="padding:7px 0;text-align:right;'
         + (strong ? 'font-weight:800' : '') + '">' + v + '</td></tr>';
  };

  return ''
  + '<div class="card">'
  +   '<div style="font-weight:700;margin-bottom:4px">얼마나 절약되나요?</div>'
  +   '<div style="font-size:12.5px;color:#6b7280;margin-bottom:14px">'
  +     'cafe24 호스팅 <b>자이언트플러스</b> 기준 (월 ' + won(CAFE_MONTH)
  +     ' · 설치비 ' + won(CAFE_SETUP) + ', 2026-09 조회)'
  +   '</div>'

  +   '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
  +     '<div style="border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px">'
  +       '<div style="font-size:13px;color:#6b7280;margin-bottom:8px">cafe24 로 직접 쓸 때</div>'
  +       '<table style="width:100%;border-collapse:collapse;font-size:13.5px">'
  +         row('월 사용료 ×12', won(CAFE_MONTH * 12))
  +         row('설치비', won(CAFE_SETUP))
  +         row('도메인 유지관리', won(DOMAIN_YEAR))
  +         row('<b>첫 1년 합계</b>', '<b>' + won(cafeFirst) + '</b>', true)
  +       '</table>'
  +     '</div>'
  +     '<div style="border:2px solid #16a34a;border-radius:10px;padding:14px 16px;background:#f0fdf4">'
  +       '<div style="font-size:13px;color:#166534;margin-bottom:8px;font-weight:700">지금 이 서비스</div>'
  +       '<table style="width:100%;border-collapse:collapse;font-size:13.5px">'
  +         row('월 결제 ×12', won(ourMonthYear))
  +         row('1년 선결제 <span style="color:#166534">(' + (B.annual_dc_pct || 0) + '% 할인)</span>',
                  won(ourAnnual))
  +         row('설치비', '<span style="color:#166534">없음</span>')
  +         row('도메인 유지관리', '<span style="color:#166534">포함</span>')
  +       '</table>'
  +     '</div>'
  +   '</div>'

  +   '<div style="margin-top:14px;padding:14px 16px;border-radius:10px;'
  +     'background:#ecfdf5;border:1px solid #a7f3d0;text-align:center">'
  +     '<div style="font-size:13.5px;color:#065f46">1년 선결제로 쓰시면 첫 해에</div>'
  +     '<div style="font-size:26px;font-weight:800;color:#047857;letter-spacing:-.5px;margin:2px 0">'
  +       won(saveAnnual) + ' 절약'
  +     '</div>'
  +     '<div style="font-size:12.5px;color:#059669">'
  +       '다음 해부터도 매년 ' + won(cafeNext - ourAnnual) + ' 절약 · '
  +       '월 결제로 쓰셔도 첫 해 ' + won(cafeFirst - ourMonthYear) + ' 절약'
  +     '</div>'
  +   '</div>'

  +   '<div style="margin-top:12px;font-size:12.5px;color:#6b7280;line-height:1.65">'
  +     '<b>부가 서비스</b> — 도메인 유지관리비(연 ' + won(DOMAIN_YEAR) + ')가 요금에 포함되어 있습니다. '
  +     '설치비도 받지 않습니다.'
  +   '</div>'
  + '</div>';
}

function _me() {
  try {
    var raw = localStorage.getItem('eden_user')
           || (window.parent && window.parent.localStorage.getItem('eden_user'));
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

async function pay(method) {
  if (!B) return;
  const amount = PLAN === 'annual' ? B.annual_fee : B.monthly_fee;
  const msg = document.getElementById('msg');
  if (!amount) { msg.innerHTML = '<span style="color:#c5221f">결제 금액이 0원입니다.</span>'; return; }
  let cfg;
  try { cfg = await (await fetch('/api/server-billing/pay-config')).json(); }
  catch (e) { msg.innerHTML = '<span style="color:#c5221f">결제 설정을 불러오지 못했습니다.</span>'; return; }
  if (!cfg.enabled || !cfg.client_key) {
    msg.innerHTML = '<span style="color:#c5221f">결제가 아직 준비되지 않았습니다. 서비스 제공자에게 문의해 주세요.</span>';
    return;
  }
  if (typeof AUTHNICE === 'undefined') { msg.innerHTML = '<span style="color:#c5221f">결제 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.</span>'; return; }
  const req = {
    clientId: cfg.client_key,
    method: method,                       // card | vbank
    orderId: 'SB' + SITE.toUpperCase() + Date.now(),
    amount: amount,
    // 카드 매출전표(영수증)에 찍히는 품목 이름 — 교수오빠 지정(2026-09-14)
    goodsName: '홈페이지유지관리비 (' + (PLAN === 'annual' ? '1년' : '1개월') + ')',
    returnUrl: location.origin + '/api/server-billing/return',
    mallReserved: SITE + '::' + PLAN,
    // 구매자 정보 — **영수증 조회에 쓰인다** (2026-09-15).
    // ⚠️ 안 보내면 나이스페이 「영수증 확인」에서 구매자명으로 찾을 수 없다.
    //    실제로 결제하고도 영수증을 못 찾았다.
    buyerName: '이든푸드',
    buyerEmail: (_me().email || ''),
    buyerTel: (_me().phone || ''),
    fnError: function (r) {
      msg.innerHTML = '<span style="color:#c5221f">결제 실패: '
                    + (r.errorMsg || r.resultMsg || '알 수 없는 오류') + '</span>';
    }
  };
  // ⚠️ 가상계좌는 **예금주명이 필수**다. 없으면 결제창이 아예 안 뜨고
  //    「[P007] 필수 파라미터 예금주명:vbankHolder가 없습니다」로 막힌다.
  if (method === 'vbank') {
    req.vbankHolder = '이든푸드';
    // ⚠️ 날짜는 **ISO8601(YYYY-MM-DD)** 이어야 한다. YYYYMMDD 로 보내면 [P024] 로 막힌다.
    const d = new Date(Date.now() + 3 * 864e5);           // 입금 기한 3일
    req.vbankExpDate = d.getFullYear() + '-'
      + String(d.getMonth() + 1).padStart(2, '0') + '-'
      + String(d.getDate()).padStart(2, '0');
  }
  AUTHNICE.requestPay(req);
}

window.addEventListener('message', function (ev) {
  const msg = document.getElementById('msg');
  if (ev.data === 'nicepay:success') {
    msg.innerHTML = '<span style="color:#137333;font-weight:700">결제가 완료되었습니다. 감사합니다!</span>';
    setTimeout(load, 1500);
  } else if (ev.data === 'nicepay:fail') {
    msg.innerHTML = '<span style="color:#c5221f">결제가 완료되지 않았습니다.</span>';
  }
});

load();
</script>
</body>
</html>
