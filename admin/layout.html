<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 대시보드 - 이든푸드</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/global.css" />
  <style>
    :root {
      --admin-primary: #1e40af;
      --admin-sidebar: #1e293b;
      --admin-hover: #334155;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f1f5f9;
      color: #1f2937;
      line-height: 1.5;
    }
    
    /* 전체 레이아웃 */
    .admin-layout {
      display: flex;
      min-height: 100vh;
    }
    
    /* 사이드바 */
    .admin-sidebar {
      width: 260px;
      background: var(--admin-sidebar);
      color: white;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
    }
    
    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: white;
    }
    
    .sidebar-logo img {
      height: 40px;
      width: auto;
    }
    
    .sidebar-logo-text {
      font-size: 1.125rem;
      font-weight: 700;
    }
    
    .sidebar-nav {
      padding: 1rem 0;
    }
    
    .nav-group {
      margin-bottom: 1.5rem;
    }
    
    .nav-group-title {
      padding: 0.5rem 1.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.5);
    }
    
    .nav-item {
      display: flex;
      align-items: center;
      padding: 0.75rem 1.5rem;
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      transition: all 0.2s;
      position: relative;
      cursor: pointer;
    }
    
    .nav-item:hover {
      background: var(--admin-hover);
      color: white;
    }
    
    .nav-item.active {
      background: var(--admin-hover);
      color: white;
    }
    
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #3b82f6;
    }
    
    .nav-item-icon {
      margin-right: 0.75rem;
      font-size: 1.25rem;
      width: 24px;
      text-align: center;
    }
    
    .sidebar-footer {
      padding: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: auto;
    }
    
    .admin-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    
    .admin-avatar {
      width: 40px;
      height: 40px;
      background: #3b82f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    
    .admin-details {
      flex: 1;
    }
    
    .admin-name {
      font-weight: 600;
      font-size: 0.875rem;
    }
    
    .admin-role {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
    }
    
    .logout-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 0.375rem;
      color: white;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    /* 메인 컨텐츠 */
    .admin-main {
      flex: 1;
      margin-left: 260px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* 헤더 */
    .admin-header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .header-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
    }
    
    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .version-info {
      font-size: 0.875rem;
      color: #6b7280;
    }
    
    /* 컨텐츠 영역 */
    .admin-content {
      flex: 1;
      padding: 2rem;
    }
    
    /* 모바일 대응 */
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #374151;
    }
    
    @media (max-width: 768px) {
      .admin-sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s;
      }
      
      .admin-sidebar.open {
        transform: translateX(0);
      }
      
      .admin-main {
        margin-left: 0;
      }
      
      .mobile-menu-btn {
        display: block;
      }
      
      .admin-header {
        padding: 1rem;
      }
      
      .admin-content {
        padding: 1rem;
      }
    }
    
    /* 오버레이 */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 90;
    }
    
    .sidebar-overlay.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- 사이드바 -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="sidebar-header">
        <a href="/admin" class="sidebar-logo">
          <img src="/assets/umjilogo.png" alt="이든푸드">
          <span class="sidebar-logo-text">(주)이든푸드</span>
        </a>
      </div>
      
      <nav class="sidebar-nav">
        <div class="nav-group">
          <div class="nav-group-title">대시보드</div>
          <a href="#" class="nav-item active" onclick="loadContent('dashboard')">
            <span class="nav-item-icon">📊</span>
            <span>대시보드</span>
          </a>
        </div>
        
        <div class="nav-group">
          <div class="nav-group-title">콘텐츠 관리</div>
          <a href="#" class="nav-item" onclick="loadContent('notices')">
            <span class="nav-item-icon">📢</span>
            <span>공지사항 관리</span>
          </a>
          <a href="#" class="nav-item" onclick="loadContent('banner')">
            <span class="nav-item-icon">📊</span>
            <span>히어로 배너 관리</span>
          </a>
          <a href="#" class="nav-item" onclick="loadContent('about')">
            <span class="nav-item-icon">🏢</span>
            <span>회사소개 관리</span>
          </a>
          <a href="#" class="nav-item" onclick="loadContent('products')">
            <span class="nav-item-icon">🍜</span>
            <span>제품소개 관리</span>
          </a>
          <a href="#" class="nav-item" onclick="loadContent('brands')">
            <span class="nav-item-icon">🏪</span>
            <span>브랜드·창업지원 관리</span>
          </a>
          <a href="#" class="nav-item" onclick="loadContent('logistics')">
            <span class="nav-item-icon">🚚</span>
            <span>물류·유통시스템 관리</span>
          </a>
          <a href="#" class="nav-item" onclick="loadContent('gallery')">
            <span class="nav-item-icon">🖼️</span>
            <span>갤러리 관리</span>
          </a>
          <a href="#" class="nav-item" onclick="loadContent('documents')">
            <span class="nav-item-icon">📄</span>
            <span>문서 관리</span>
          </a>
          <a href="#" class="nav-item" onclick="loadContent('contacts')">
            <span class="nav-item-icon">📞</span>
            <span>문의 관리</span>
          </a>
        </div>
        
        <div class="nav-group">
          <div class="nav-group-title">시스템 관리</div>
          <a href="#" class="nav-item" onclick="loadContent('users')">
            <span class="nav-item-icon">👥</span>
            <span>사용자 관리</span>
          </a>
          <a href="#" class="nav-item" onclick="loadContent('settings')">
            <span class="nav-item-icon">⚙️</span>
            <span>시스템 설정</span>
          </a>
        </div>
      </nav>
      
      <div class="sidebar-footer">
        <div class="admin-info">
          <div class="admin-avatar">관</div>
          <div class="admin-details">
            <div class="admin-name" id="admin-name">관리자</div>
            <div class="admin-role">시스템 관리자</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">
          <span>🚪</span>
          <span>로그아웃</span>
        </button>
      </div>
    </aside>
    
    <!-- 모바일 오버레이 -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    
    <!-- 메인 영역 -->
    <main class="admin-main">
      <!-- 헤더 -->
      <header class="admin-header">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
          <h1 class="header-title" id="page-title">대시보드</h1>
        </div>
        <div class="header-actions">
          <span class="version-info">Ver.3.0.20260210</span>
        </div>
      </header>
      
      <!-- 컨텐츠 영역 -->
      <div class="admin-content" id="admin-content">
        <!-- 동적 컨텐츠가 여기에 로드됩니다 -->
      </div>
    </main>
  </div>
  
  <script>
    // 페이지 로드 시 인증 체크
    document.addEventListener('DOMContentLoaded', async () => {
      // 저장된 테마 로드
      const savedPrimary = localStorage.getItem('theme_primary');
      const savedSecondary = localStorage.getItem('theme_secondary');
      
      if (savedPrimary) {
        document.documentElement.style.setProperty('--primary', savedPrimary);
        document.documentElement.style.setProperty('--primary-600', savedPrimary);
      }
      
      if (savedSecondary) {
        document.documentElement.style.setProperty('--admin-primary', savedSecondary);
      }
      
      const token = localStorage.getItem('eden_token');
      if (!token) {
        location.href = '/login';
        return;
      }
      
      try {
        const response = await fetch('/api/auth/me', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await response.json();
        
        if (!data.ok || data.user.role !== 'admin') {
          alert('관리자 권한이 필요합니다.');
          location.href = '/';
          return;
        }
        
        document.getElementById('admin-name').textContent = data.user.name || '관리자';
      } catch (error) {
        console.error('인증 확인 실패:', error);
        location.href = '/login';
      }
      
      // 초기 대시보드 로드
      loadContentInitial('dashboard');
    });
    
    // 사이드바 토글
    function toggleSidebar() {
      const sidebar = document.getElementById('admin-sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    }
    
    // 컨텐츠 로드
    async function loadContent(page) {
      const contentArea = document.getElementById('admin-content');
      const pageTitle = document.getElementById('page-title');
      
      // 활성 메뉴 표시
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
      });
      if (event && event.target) {
        event.target.closest('.nav-item').classList.add('active');
      }
      
      // 모바일에서 사이드바 닫기
      if (window.innerWidth < 768) {
        toggleSidebar();
      }
      
      // iframe으로 기존 페이지 로드
      let iframeSrc = '';
      
      switch(page) {
        case 'dashboard':
          pageTitle.textContent = '대시보드';
          // iframe으로 로드하여 스크립트 실행 보장
          iframeSrc = '/admin/dashboard.html';
          break;
          
        case 'notices':
          pageTitle.textContent = '공지사항 관리';
          iframeSrc = '/admin/notices.html';
          break;
          
        case 'about':
          pageTitle.textContent = '회사소개 관리';
          iframeSrc = '/admin/about.html';
          break;
          
        case 'products':
          pageTitle.textContent = '제품소개 관리';
          iframeSrc = '/admin/products.html';
          break;
          
        case 'brands':
          pageTitle.textContent = '브랜드·창업지원 관리';
          iframeSrc = '/admin/brands.html';
          break;
          
        case 'logistics':
          pageTitle.textContent = '물류·유통시스템 관리';
          iframeSrc = '/admin/logistics.html';
          break;
          
        case 'gallery':
          pageTitle.textContent = '갤러리 관리';
          iframeSrc = '/admin/gallery.html';
          break;
          
        case 'documents':
          pageTitle.textContent = '문서 관리';
          iframeSrc = '/admin/documents.html';
          break;
          
        case 'contacts':
          pageTitle.textContent = '문의 관리';
          iframeSrc = '/admin/contacts.html';
          break;
          
        case 'users':
          pageTitle.textContent = '사용자 관리';
          iframeSrc = '/admin/users.html';
          break;
          
        case 'settings':
          pageTitle.textContent = '시스템 설정';
          iframeSrc = '/admin/settings.html';
          break;
          
        default:
          contentArea.innerHTML = '<p>페이지를 준비 중입니다.</p>';
          return;
      }
      
      // iframe으로 페이지 로드
      contentArea.innerHTML = `
        <iframe 
          id="contentFrame"
          src="${iframeSrc}" 
          style="width: 100%; height: calc(100vh - 120px); border: none; background: white; border-radius: 0.75rem;"
          onload="setupIframe(this)">
        </iframe>
      `;
    }
    
    // iframe 설정
    function setupIframe(iframe) {
      try {
        const iframeDoc = iframe.contentWindow.document;
        const iframeWin = iframe.contentWindow;
        
        // 토큰 전달
        const token = localStorage.getItem('eden_token');
        if (token) {
          iframeWin.localStorage.setItem('eden_token', token);
        }
        
        // 불필요한 요소 제거
        iframeDoc.querySelector('.header')?.remove();
        iframeDoc.querySelector('.admin-header')?.remove();
        iframeDoc.querySelector('.admin-nav')?.remove();
        iframeDoc.querySelector('.admin-nav-header')?.remove();
        iframeDoc.querySelector('[onclick*="goBack"]')?.remove();
        iframeDoc.querySelector('[onclick*="location.href = \'/admin\'"]')?.remove();
        
        // 스타일 조정
        iframeDoc.body.style.paddingTop = '0';
        iframeDoc.body.style.background = 'transparent';
        
        // 컨테이너가 있으면 여백 조정
        const container = iframeDoc.querySelector('.container, .admin-container');
        if (container) {
          container.style.paddingTop = '0';
          container.style.marginTop = '0';
        }
        
        // 인증 리다이렉트 방지
        if (iframeWin.location.href.includes('/login')) {
          console.log('로그인 페이지 리다이렉트 방지');
          iframeWin.history.back();
        }
      } catch (error) {
        console.error('iframe 설정 오류:', error);
      }
    }
    
    // 초기 로드용 함수
    async function loadContentInitial(page) {
      // iframe을 통해 로드하도록 loadContent 사용
      loadContent(page);
    }
    
    // 로그아웃
    function logout() {
      if (confirm('로그아웃 하시겠습니까?')) {
        localStorage.removeItem('eden_token');
        location.href = '/login';
      }
    }
  </script>
</body>
</html>
