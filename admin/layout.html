<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 대시보드 - 이든푸드</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/global.css" />
  <style>
    :root {
      --admin-primary: #1e40af;
      --admin-sidebar: #1e293b;
      --admin-hover: #334155;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f1f5f9;
      color: #1f2937;
      line-height: 1.5;
    }
    
    /* 전체 레이아웃 */
    .admin-layout {
      display: flex;
      min-height: 100vh;
    }
    
    /* 사이드바 */
    .admin-sidebar {
      width: 260px;
      background: var(--admin-sidebar);
      color: white;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
    }
    
    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: white;
    }
    
    .sidebar-logo img {
      height: 40px;
      width: auto;
    }
    
    .sidebar-logo-text {
      font-size: 1.125rem;
      font-weight: 700;
    }
    
    .sidebar-nav {
      padding: 1rem 0;
    }
    
    .nav-group {
      margin-bottom: 1.5rem;
    }
    
    .nav-group-title {
      padding: 0.5rem 1.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.5);
    }
    
    .nav-item {
      display: flex;
      align-items: center;
      padding: 0.75rem 1.5rem;
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      transition: all 0.2s;
      position: relative;
      cursor: pointer;
    }
    
    .nav-item:hover {
      background: var(--admin-hover);
      color: white;
    }
    
    .nav-item.active {
      background: var(--admin-hover);
      color: white;
    }
    
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #3b82f6;
    }
    
    .nav-item-icon {
      margin-right: 0.75rem;
      font-size: 1.25rem;
      width: 24px;
      text-align: center;
    }
    
    .sidebar-footer {
      padding: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: auto;
    }
    
    .admin-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    
    .admin-avatar {
      width: 40px;
      height: 40px;
      background: #3b82f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    
    .admin-details {
      flex: 1;
    }
    
    .admin-name {
      font-weight: 600;
      font-size: 0.875rem;
    }
    
    .admin-role {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
    }
    
    .logout-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 0.375rem;
      color: white;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    /* 메인 컨텐츠 */
    .admin-main {
      flex: 1;
      margin-left: 260px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* 헤더 */
    .admin-header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .header-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
    }
    
    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .version-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.8rem; font-weight: 600;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
      font-family: inherit;
    }
    .version-badge.up-to-date {
      background: #dcfce7; color: #15803d;
    }
    .version-badge.up-to-date:hover { background: #bbf7d0; }
    .version-badge.outdated {
      background: #dbeafe; color: #1d4ed8;
    }
    .version-badge.outdated:hover { background: #bfdbfe; }
    .version-badge.checking {
      background: #f3f4f6; color: #6b7280;
      cursor: default;
    }

    /* README 모달 */
    .readme-modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 9999;
      align-items: center; justify-content: center;
    }
    .readme-modal-backdrop.show { display: flex; }
    .readme-modal {
      background: #fff; border-radius: 1rem;
      width: 90%; max-width: 700px; max-height: 85vh;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .readme-modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #e5e7eb;
      display: flex; align-items: center; justify-content: space-between;
    }
    .readme-modal-header h2 { font-size: 1.1rem; font-weight: 700; margin: 0; }
    .readme-modal-close {
      background: none; border: none; font-size: 1.4rem;
      cursor: pointer; color: #6b7280; line-height: 1;
    }
    .readme-modal-body {
      padding: 1.5rem; overflow-y: auto; flex: 1;
      font-size: 0.875rem; line-height: 1.75; color: #374151;
    }
    .readme-modal-body h3 { font-size: 1rem; font-weight: 700; margin: 1.25rem 0 0.5rem; color: #111827; }
    .readme-modal-body h4 { font-size: 0.875rem; font-weight: 700; margin: 1rem 0 0.375rem; color: #1f2937; }
    .readme-modal-body ul { padding-left: 1.25rem; }
    .readme-modal-body li { margin-bottom: 0.25rem; }
    .readme-modal-body p { margin-bottom: 0.5rem; }
    .readme-modal-body pre {
      background: #f9fafb; border: 1px solid #e5e7eb;
      border-radius: 0.375rem; padding: 0.75rem;
      overflow-x: auto; font-size: 0.8rem;
    }
    
    /* 컨텐츠 영역 */
    .admin-content {
      flex: 1;
      padding: 2rem;
    }
    
    /* 모바일 대응 */
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #374151;
    }
    
    @media (max-width: 768px) {
      .admin-sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s;
      }
      
      .admin-sidebar.open {
        transform: translateX(0);
      }
      
      .admin-main {
        margin-left: 0;
      }
      
      .mobile-menu-btn {
        display: block;
      }
      
      .admin-header {
        padding: 1rem;
      }
      
      .admin-content {
        padding: 1rem;
      }
    }
    
    /* 오버레이 */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 90;
    }
    
    .sidebar-overlay.show {
      display: block;
    }
  </style>
</head>

  <script>
    const CURRENT_VERSION = 'Ver.3.9.20260622';
    let readmeContent = '';

    let isLatestVersion = false;

    async function initVersionBadge() {
      const badge = document.getElementById('version-badge');
      try {
        const token = localStorage.getItem('eden_token');
        const res = await fetch('/api/readme-version', { cache: 'no-store', headers: { 'Authorization': 'Bearer ' + token } });
        if (!res.ok) throw new Error();
        const data = await res.json();
        const latest = (data.data || data).version;
        readmeContent = (data.data || data).history || '';
        isLatestVersion = (latest === CURRENT_VERSION);
        if (isLatestVersion) {
          badge.className = 'version-badge up-to-date';
          badge.textContent = '✅ ' + CURRENT_VERSION;
          badge.title = '변경 이력 보기';
        } else {
          badge.className = 'version-badge outdated';
          badge.textContent = '🔄 ' + CURRENT_VERSION + ' → ' + latest;
          badge.title = '변경 이력 / 업그레이드';
        }
        badge.onclick = openReadme;
      } catch {
        badge.className = 'version-badge up-to-date';
        badge.textContent = '📌 ' + CURRENT_VERSION;
        badge.onclick = openReadme;
        readmeContent = '';
      }
    }

    function hardReload() {
      closeReadme();
      if ('caches' in window) {
        caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).finally(() => location.reload(true));
      } else {
        location.reload(true);
      }
    }

    function openReadme() {
      const modal = document.getElementById('readme-modal');
      const body = document.getElementById('readme-modal-body');
      const footer = document.getElementById('readme-modal-footer');

      body.innerHTML = readmeContent
        ? readmeContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/^(### .+)$/gm, '<h3>$1</h3>')
            .replace(/^(#### .+)$/gm, '<h4>$1</h4>')
            .replace(/^- (.+)$/gm, '<li>$1</li>')
            .replace(/(<li>.*<\/li>\n?)+/gs, m => '<ul>'+m+'</ul>')
            .replace(/\n\n/g, '<br>')
        : '<p style="color:#6b7280">변경 이력을 불러올 수 없습니다.</p>';

      if (isLatestVersion) {
        footer.innerHTML = `
          <span style="font-size:0.8rem;color:#6b7280;margin-right:auto;">최신 버전입니다</span>
          <button onclick="closeReadme()" style="padding:0.4rem 1rem;border:1px solid #d1d5db;border-radius:0.375rem;background:white;cursor:pointer;font-size:0.875rem;">닫기</button>
          <button onclick="hardReload()" style="padding:0.4rem 1rem;border:none;border-radius:0.375rem;background:#1d4ed8;color:white;cursor:pointer;font-size:0.875rem;font-weight:600;">🔄 캐시 초기화 & 새로고침</button>
        `;
      } else {
        footer.innerHTML = `
          <span style="font-size:0.8rem;color:#6b7280;margin-right:auto;">업그레이드 후 자동으로 새로고침됩니다</span>
          <button onclick="closeReadme()" style="padding:0.4rem 1rem;border:1px solid #d1d5db;border-radius:0.375rem;background:white;cursor:pointer;font-size:0.875rem;">닫기</button>
          <button onclick="hardReload()" style="padding:0.4rem 1rem;border:none;border-radius:0.375rem;background:#059669;color:white;cursor:pointer;font-size:0.875rem;font-weight:600;">⬆️ 업그레이드</button>
        `;
      }

      modal.classList.add('show');
    }

    function closeReadme() {
      document.getElementById('readme-modal').classList.remove('show');
    }

    document.getElementById('readme-modal').addEventListener('click', e => {
      if (e.target.id === 'readme-modal') closeReadme();
    });
  </script>
  <script>
    // 페이지 로드 시 인증 체크
    document.addEventListener('DOMContentLoaded', async () => {
      // 저장된 테마 로드
      const savedPrimary = localStorage.getItem('theme_primary');
      const savedSecondary = localStorage.getItem('theme_secondary');
      
      if (savedPrimary) {
        document.documentElement.style.setProperty('--primary', savedPrimary);
        document.documentElement.style.setProperty('--primary-600', savedPrimary);
      }
      
      if (savedSecondary) {
        document.documentElement.style.setProperty('--admin-primary', savedSecondary);
      }
      
      const token = localStorage.getItem('eden_token');
      if (!token) {
        location.href = '/login';
        return;
      }
      
      try {
        const response = await fetch('/api/auth/me', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await response.json();
        
        if (!data.ok || data.user.role !== 'admin') {
          alert('관리자 권한이 필요합니다.');
          location.href = '/';
          return;
        }
        
        document.getElementById('admin-name').textContent = data.user.name || '관리자';
      } catch (error) {
        console.error('인증 확인 실패:', error);
        location.href = '/login';
      }
      
      initVersionBadge();
      loadUnreadBadge();
      setInterval(loadUnreadBadge, 60000);
      // 초기 대시보드 로드
      loadContentInitial('dashboard');
    });
    
    // 사이드바 토글
    function toggleSidebar() {
      const sidebar = document.getElementById('admin-sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    }
    
    // 컨텐츠 로드
    async function loadContent(page) {
      const contentArea = document.getElementById('admin-content');
      const pageTitle = document.getElementById('page-title');
      
      // 활성 메뉴 표시
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
      });
      if (event && event.target) {
        event.target.closest('.nav-item').classList.add('active');
      }
      
      // 모바일에서 사이드바 닫기
      if (window.innerWidth < 768) {
        toggleSidebar();
      }
      
      // iframe으로 기존 페이지 로드
      let iframeSrc = '';
      
      switch(page) {
        case 'dashboard':
          pageTitle.textContent = '대시보드';
          // iframe으로 로드하여 스크립트 실행 보장
          iframeSrc = '/admin/dashboard.html';
          break;
          
        case 'notices':
          pageTitle.textContent = '공지사항 관리';
          iframeSrc = '/admin/notices.html';
          break;
          
        case 'about':
          pageTitle.textContent = '회사소개 관리';
          iframeSrc = '/admin/about.html';
          break;
          
        case 'products':
          pageTitle.textContent = '제품소개 관리';
          iframeSrc = '/admin/products.html';
          break;
          
        case 'brands':
          pageTitle.textContent = '브랜드·창업지원 관리';
          iframeSrc = '/admin/brands.html';
          break;
          
        case 'logistics':
          pageTitle.textContent = '물류·유통시스템 관리';
          iframeSrc = '/admin/logistics.html';
          break;
          
        case 'gallery':
          pageTitle.textContent = '갤러리 관리';
          iframeSrc = '/admin/gallery.html';
          break;
          
        case 'documents':
          pageTitle.textContent = '문서 관리';
          iframeSrc = '/admin/documents.html';
          break;
          
        case 'contacts':
          pageTitle.textContent = '문의 관리';
          iframeSrc = '/admin/contacts.html';
          break;
          
        case 'analytics':
          pageTitle.textContent = '방문 통계';
          iframeSrc = '/admin/analytics.html';
          break;

        case 'users':
          pageTitle.textContent = '사용자 관리';
          iframeSrc = '/admin/users.html';
          break;
          
        case 'settings':
          pageTitle.textContent = '시스템 설정';
          iframeSrc = '/admin/settings.html';
          break;
          
        default:
          contentArea.innerHTML = '<p>페이지를 준비 중입니다.</p>';
          return;
      }
      
      // iframe으로 페이지 로드
      contentArea.innerHTML = `
        <iframe 
          id="contentFrame"
          src="${iframeSrc}" 
          style="width: 100%; height: calc(100vh - 120px); border: none; background: white; border-radius: 0.75rem;"
          onload="setupIframe(this)">
        </iframe>
      `;
    }
    
    // iframe 설정
    function setupIframe(iframe) {
      try {
        const iframeDoc = iframe.contentWindow.document;
        const iframeWin = iframe.contentWindow;
        
        // 토큰 전달
        const token = localStorage.getItem('eden_token');
        if (token) {
          iframeWin.localStorage.setItem('eden_token', token);
        }
        
        // 불필요한 요소 제거
        iframeDoc.querySelector('.header')?.remove();
        iframeDoc.querySelector('.admin-header')?.remove();
        iframeDoc.querySelector('.admin-nav')?.remove();
        iframeDoc.querySelector('.admin-nav-header')?.remove();
        iframeDoc.querySelector('[onclick*="goBack"]')?.remove();
        iframeDoc.querySelector('[onclick*="location.href = \'/admin\'"]')?.remove();
        
        // 스타일 조정
        iframeDoc.body.style.paddingTop = '0';
        iframeDoc.body.style.background = 'transparent';
        
        // 컨테이너가 있으면 여백 조정
        const container = iframeDoc.querySelector('.container, .admin-container');
        if (container) {
          container.style.paddingTop = '0';
          container.style.marginTop = '0';
        }
        
        // 인증 리다이렉트 방지
        if (iframeWin.location.href.includes('/login')) {
          console.log('로그인 페이지 리다이렉트 방지');
          iframeWin.history.back();
        }
      } catch (error) {
        console.error('iframe 설정 오류:', error);
      }
    }
    
    // 초기 로드용 함수
    async function loadContentInitial(page) {
      // iframe을 통해 로드하도록 loadContent 사용
      loadContent(page);
    }
    
    // 미읽 문의 배지
    async function loadUnreadBadge() {
      try {
        const token = localStorage.getItem('eden_token');
        const res = await fetch('/api/contacts/unread-count', { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json();
        const badge = document.getElementById('contact-badge');
        if (data.ok && data.data.count > 0) {
          badge.textContent = data.data.count > 99 ? '99+' : data.data.count;
          badge.style.display = 'inline-block';
        } else {
          badge.style.display = 'none';
        }
      } catch {}
    }

    // 로그아웃
    function logout() {
      if (confirm('로그아웃 하시겠습니까?')) {
        localStorage.removeItem('eden_token');
        location.href = '/login';
      }
    }
  </script>
</body>
</html>
